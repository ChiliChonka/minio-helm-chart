name: helm-lint

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Add minio Helm repository
        run: helm repo add minio https://charts.min.io/

      - name: Update chart dependencies
        run: helm dependency update minio

      - name: Lint chart (CI values)
        run: |
          helm lint minio \
            --strict \
            --values minio/values.yaml

      - name: Render templates (CI values)
        run: |
          helm template minio minio \
            --namespace minio \
            --values minio/values.yaml \
            > /tmp/rendered.yaml
