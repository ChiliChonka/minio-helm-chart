nfs:
  server: "192.168.1.100"
  path: "/volume1/minio"
  storage: "100Gi"

minio:
  mode: standalone

  existingSecret: "minio-root-credentials"

  persistence:
    enabled: true
    existingClaim: "minio-nfs-pvc"

  # Kein ingress/consoleIngress (TASK-355): Der Zugang läuft über die HTTPRoutes unten am
  # Envoy-Gateway; ingress-nginx ist seit 2026-09-22 abgebaut. Upstream-Default: `enabled: false`.

  environment:
    MINIO_BROWSER_REDIRECT_URL: "https://console.minio.example.com"

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  buckets: []
  postJob:
    enabled: false

# HTTPRoute(s) am geteilten Envoy-Gateway (TASK-336, templates/httproute.yaml). Aus per Default;
# Werte für prod in helm-values/minio-helm-chart/minio-values.yaml.
httpRoute:
  enabled: false
  parentRef: {}
  routes: []
